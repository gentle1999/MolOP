name: Docs Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "main or a release tag such as v0.2.5.post1"
        required: true
        default: main
        type: string
      update_latest:
        description: "Point latest and the site root at this tag (use only for the newest release)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MOLOP_DOCS_REF: ${{ inputs.source_ref || github.ref_name }}
      REQUEST_LATEST: ${{ inputs.update_latest || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --group docs

      - name: Resolve documentation version
        id: docs-version
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: >-
          uv run --frozen --group docs python scripts/resolve_docs_version.py
          "$SOURCE_REF" "$REQUEST_LATEST" >> "$GITHUB_OUTPUT"

      - name: Execute documentation notebooks
        run: |
          uv run --frozen --group docs jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=120 \
            --ExecutePreprocessor.kernel_name=python3 \
            docs/zh/examples/*.ipynb docs/en/examples/*.ipynb
          rm -f summary.csv docs/zh/examples/summary.csv docs/en/examples/summary.csv

      - name: Build docs
        env:
          NO_MKDOCS_2_WARNING: "1"
          MOLOP_DOCS_SOURCE_VERSION: ${{ steps.docs-version.outputs.source_version }}
          MOLOP_DOCS_CHANNEL: ${{ steps.docs-version.outputs.channel }}
        run: uv run --frozen --group docs mkdocs build --strict -f mkdocs.yml

      - name: Configure documentation deployment identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy development snapshot
        if: steps.docs-version.outputs.snapshot_kind == 'development'
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: >-
          uv run --frozen --group docs --with mike==2.2.0 mike deploy
          --push
          --update-aliases
          --alias-type copy
          --title "main (development)"
          main dev

      - name: Deploy release snapshot
        if: steps.docs-version.outputs.snapshot_kind == 'tag'
        env:
          NO_MKDOCS_2_WARNING: "1"
          DOCS_VERSION: ${{ steps.docs-version.outputs.version }}
          UPDATE_LATEST: ${{ steps.docs-version.outputs.update_latest }}
        run: |
          if [[ "$UPDATE_LATEST" == "true" ]]; then
            uv run --frozen --group docs --with mike==2.2.0 mike deploy \
              --push \
              --update-aliases \
              --alias-type copy \
              --title "MolOP ${DOCS_VERSION}" \
              "${DOCS_VERSION}" latest
            uv run --frozen --group docs --with mike==2.2.0 mike set-default --push latest
          else
            uv run --frozen --group docs --with mike==2.2.0 mike deploy \
              --push \
              --alias-type copy \
              --title "MolOP ${DOCS_VERSION}" \
              "${DOCS_VERSION}"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare versioned Pages artifact
        run: |
          git fetch origin gh-pages
          git fetch origin main --depth=1
          mkdir pages-site
          git archive origin/gh-pages | tar -x -C pages-site
          git show origin/main:.github/pages-root-404.html > pages-site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
