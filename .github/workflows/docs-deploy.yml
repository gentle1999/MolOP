name: Docs Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "main or a release tag such as v0.2.5.post1"
        required: true
        default: main
        type: string
      update_latest:
        description: "Point latest and the site root at this tag (use only for the newest release)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      docs_version: ${{ steps.docs-version.outputs.version }}
      update_latest: ${{ steps.docs-version.outputs.update_latest }}
      pages_artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}
      pages_build_version: ${{ steps.pages-build.outputs.version }}
    env:
      MOLOP_DOCS_REF: ${{ inputs.source_ref || github.ref_name }}
      REQUEST_LATEST: ${{ inputs.update_latest || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # A branch ref can move while a queued run is waiting.  For push
          # events, build exactly the revision that triggered this run.
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Record documentation source commit
        id: docs-source
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "MOLOP_DOCS_COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --group docs

      - name: Resolve documentation version
        id: docs-version
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: >-
          uv run --frozen --group docs python scripts/resolve_docs_version.py
          "$SOURCE_REF" "$REQUEST_LATEST" >> "$GITHUB_OUTPUT"

      - name: Execute documentation notebooks
        run: |
          uv run --frozen --group docs jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=120 \
            --ExecutePreprocessor.kernel_name=python3 \
            docs/zh/examples/*.ipynb docs/en/examples/*.ipynb
          rm -f summary.csv docs/zh/examples/summary.csv docs/en/examples/summary.csv

      - name: Build docs
        env:
          NO_MKDOCS_2_WARNING: "1"
          MOLOP_DOCS_SOURCE_VERSION: ${{ steps.docs-version.outputs.source_version }}
          MOLOP_DOCS_CHANNEL: ${{ steps.docs-version.outputs.channel }}
          MOLOP_DOCS_COMMIT: ${{ steps.docs-source.outputs.commit }}
        run: uv run --frozen --group docs mkdocs build --strict -f mkdocs.yml

      - name: Configure documentation deployment identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy development snapshot
        if: steps.docs-version.outputs.snapshot_kind == 'development'
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: >-
          uv run --frozen --group docs --with mike==2.2.0 mike deploy
          --push
          --update-aliases
          --alias-type copy
          --title "main (development)"
          main dev

      - name: Deploy release snapshot
        if: steps.docs-version.outputs.snapshot_kind == 'tag'
        env:
          NO_MKDOCS_2_WARNING: "1"
          DOCS_VERSION: ${{ steps.docs-version.outputs.version }}
          UPDATE_LATEST: ${{ steps.docs-version.outputs.update_latest }}
        run: |
          if [[ "$UPDATE_LATEST" == "true" ]]; then
            uv run --frozen --group docs --with mike==2.2.0 mike deploy \
              --push \
              --update-aliases \
              --alias-type copy \
              --title "MolOP ${DOCS_VERSION}" \
              "${DOCS_VERSION}" latest
            uv run --frozen --group docs --with mike==2.2.0 mike set-default --push latest
          else
            uv run --frozen --group docs --with mike==2.2.0 mike deploy \
              --push \
              --alias-type copy \
              --title "MolOP ${DOCS_VERSION}" \
              "${DOCS_VERSION}"
          fi

      - name: Record Pages build version
        id: pages-build
        run: |
          build_version="$(git rev-parse --verify 'gh-pages^{commit}')"
          if [[ ! "$build_version" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::gh-pages does not resolve to a commit SHA: $build_version"
            exit 1
          fi
          echo "version=$build_version" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare versioned Pages artifact
        run: |
          git fetch origin main --depth=1
          mkdir pages-site
          # mike has just updated the local gh-pages ref.  Archiving the
          # remote ref here can race with the preceding push and publish the
          # previous deployment instead.
          git archive gh-pages | tar -x -C pages-site
          git show origin/main:.github/pages-root-404.html > pages-site/404.html

      - name: Upload Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
          PAGES_BUILD_VERSION: ${{ needs.build.outputs.pages_build_version }}
        with:
          github-token: ${{ github.token }}
          script: |
            const artifactIdText = process.env.PAGES_ARTIFACT_ID || ""
            const artifactId = Number(artifactIdText)
            const buildVersion = process.env.PAGES_BUILD_VERSION || ""
            if (
              !/^\d+$/.test(artifactIdText) ||
              !Number.isSafeInteger(artifactId) ||
              artifactId <= 0
            ) {
              throw new Error(`Invalid Pages artifact id: ${artifactIdText}`)
            }
            if (!/^[0-9a-f]{40}$/.test(buildVersion)) {
              throw new Error(`Invalid Pages build version: ${buildVersion}`)
            }

            const oidcToken = await core.getIDToken()
            const { data: deployment } = await github.request(
              "POST /repos/{owner}/{repo}/pages/deployments",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifactId,
                pages_build_version: buildVersion,
                oidc_token: oidcToken,
              },
            )

            const deploymentId =
              deployment.id ?? deployment.status_url?.split("/").pop()
            if (!deploymentId) {
              throw new Error("GitHub Pages deployment did not return an id")
            }
            core.setOutput("page_url", deployment.page_url || "")

            const failureStatuses = new Set([
              "deployment_cancelled",
              "deployment_content_failed",
              "deployment_failed",
              "deployment_lost",
              "deployment_perms_error",
            ])
            let succeeded = false
            for (let attempt = 1; attempt <= 120; attempt += 1) {
              const { data: status } = await github.request(
                "GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pages_deployment_id: String(deploymentId),
                },
              )

              if (status.status === "succeed") {
                succeeded = true
                core.info(`GitHub Pages deployment succeeded: ${deploymentId}`)
                break
              }
              if (failureStatuses.has(status.status)) {
                throw new Error(
                  `GitHub Pages deployment ${deploymentId} failed with status ${status.status}`,
                )
              }
              core.info(
                `GitHub Pages deployment is ${status.status}; waiting (${attempt}/120)`,
              )
              await new Promise((resolve) => setTimeout(resolve, 5000))
            }
            if (!succeeded) {
              throw new Error(
                `Timed out waiting for GitHub Pages deployment ${deploymentId}`,
              )
            }

      - name: Verify the published documentation
        env:
          DOCS_SITE_URL: https://gentle1999.github.io/MolOP
          EXPECTED_DOCS_VERSION: ${{ needs.build.outputs.docs_version }}
          EXPECTED_UPDATE_LATEST: ${{ needs.build.outputs.update_latest }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            response="$(curl --fail --silent --show-error --location --max-time 20 \
              "${DOCS_SITE_URL}/versions.json?deployment=${GITHUB_RUN_ID}-${attempt}" || true)"
            if [[ -n "$response" ]] && printf '%s' "$response" | \
              EXPECTED_DOCS_VERSION="$EXPECTED_DOCS_VERSION" \
              EXPECTED_UPDATE_LATEST="$EXPECTED_UPDATE_LATEST" \
              python -c '
          import json
          import os
          import sys

          versions = json.load(sys.stdin)
          expected = os.environ["EXPECTED_DOCS_VERSION"]
          current = next(
              (item for item in versions if item.get("version") == expected),
              None,
          )
          latest_ok = (
              os.environ["EXPECTED_UPDATE_LATEST"] != "true"
              or (current is not None and "latest" in current.get("aliases", []))
          )
          raise SystemExit(0 if current is not None and latest_ok else 1)
          '; then
              echo "Published documentation contains ${EXPECTED_DOCS_VERSION}."
              exit 0
            fi
            echo "Published documentation is not visible yet (attempt ${attempt}/30)."
            sleep 10
          done
          echo "::error::Published documentation does not contain ${EXPECTED_DOCS_VERSION}."
          exit 1
