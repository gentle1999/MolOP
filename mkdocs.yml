    - 开发环境与质量门禁: developer/quality.md
    - 设计与模型:
      - QM 公共数据模型: design/qm_data_model.md
      - ORCA 输入文件模型: design/orca_input_model.md
    - 贡献指南: contributing.md
    - 更新日志: changelog.md
    - API 参考:
      - Registry: reference/api/registry.md
      - molop: reference/api/molop.md
      - molop.io: reference/api/io.md
      - molop.cli: reference/api/cli.md
      - molop.config: reference/api/config.md
      - molop.structure: reference/api/structure.md
      - molop.unit: reference/api/unit.md
      - molop.utils: reference/api/utils.md
      - molop.utils.progressbar: reference/api/progressbar.md


extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:  #Markdown扩展列表
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:  
      permalink: True #在 toc 扩展中启用永久链接
      separator: "_"  #分割线符号
  - smarty  #启用 SmartyPants 排版扩展
  - admonition  #通过不同颜色现实告警、备注信息
  - pymdownx.betterem
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      pygments_lang_class: true  
      auto_title: true
      linenums: true
      linenums_style: pymdownx-inline
      line_spans: __span
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
