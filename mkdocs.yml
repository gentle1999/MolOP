      - Gaussian 输入: reference/formats/gjf.md
      - Gaussian 输出: reference/formats/g16log.md
      - Gaussian 格式化检查点: reference/formats/g16fchk.md
      - ORCA 输入: reference/formats/orcainp.md
      - ORCA 输出: reference/formats/orcaout.md
      - xTB 输出: reference/formats/xtbout.md
      - CML writer: reference/formats/cml.md
      - Gaussian-like renderer: reference/formats/fakeg.md
      - OpenBabel fallback: reference/formats/openbabel-fallback.md
    - 按科学性质查找字段: reference/model_fields.md
    - CLI 命令参考: command_line_interface.md
    - Python API:
      - 概览: reference/api.md
      - AutoParser: reference/api/autoparser.md
