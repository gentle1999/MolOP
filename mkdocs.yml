site_name: MolOP Documentation
site_description: Parse computational chemistry files, inspect scientific results, and export structures with MolOP.
site_dir: public
repo_url: https://github.com/gentle1999/MolOP.git
repo_name: gentle1999/MolOP
site_url: https://gentle1999.github.io/MolOP/
edit_uri: edit/main/docs/

theme:
  name: "material"
  custom_dir: overrides
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - header.autohide
    - announce.dismiss
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - content.footnote.tooltips
    - content.code.copy
    - content.code.select
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gentle1999/MolOP.git
    - icon: fontawesome/solid/paper-plane
      link: mailto:mj_t@zju.edu.cn

copyright: Copyright &copy; 2023 - 2026 Miao-jiong Tang

plugins:
  - search:
      lang:
        - en
        - zh
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
  - mkdocs-jupyter:
      include:
        - examples/*.ipynb
      # CI pre-executes notebooks; MkDocs renders the saved outputs.
      execute: false
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home
            文档版本: Documentation Version
            快速开始: Quick Start
            安装: Installation
            5 分钟上手: 5-Minute Start
            Python API 初体验: Python API First Steps
            CLI 初体验: CLI First Steps
            理解 Batch、File 与 Frame: Understand Batch, File, and Frame
            使用指南: User Guides
            解析文件: Parse Files
            读取计算结果: Read Calculation Results
            批量汇总: Batch Summaries
            过滤与选择: Filter and Select
            格式转换与导出: Convert and Export
            结构恢复: Structure Recovery
            CLI 常用任务: CLI Task Recipes
            常见问题: Troubleshooting
            任务教程: Task Tutorials
            教程概览: Tutorial Overview
            Gaussian、ORCA 与 xTB 汇总: Gaussian, ORCA, and xTB Summary
            导出能量和热化学 CSV: Export Energy and Thermochemistry CSV
            筛选优化结果与过渡态: Select Optimized Results and Transition States
            过渡态分析: Transition-state Analysis
            导出结构和下一步输入: Export Structures and Next-Step Inputs
            Notebook 补充: Notebook Supplements
            01-Gaussian 解析与检查: 01-Gaussian Parse and Inspect
            02-批量汇总、过滤与选择: 02-Batch Summary, Filter and Select
            03-转换与导出: 03-Transform and Export
            04-过渡态前后体表示: 04-Transition-state Endpoint Representations
            格式与数据参考: Formats and Data Reference
            格式支持概览: Format Overview
            格式: Formats
            按科学性质查找字段: Find Fields by Scientific Property
            CLI 命令参考: CLI Command Reference
            API 参考: API Reference
            概览: Overview
            关键入口: Key Entry Points
            模块: Modules
            molop: molop
            molop.io: molop.io
            molop.cli: molop.cli
            molop.config: molop.config
            molop.structure: molop.structure
            molop.unit: molop.unit
            molop.utils: molop.utils
            molop.utils.progressbar: molop.utils.progressbar
            格式概览: Overview
            Gaussian 输入: Gaussian Input
            Gaussian 输出: Gaussian Output
            ORCA 输入: ORCA Input
            ORCA 输出: ORCA Output
            CML writer: CML Writer
            Gaussian-like renderer: Gaussian-Like Renderer
            OpenBabel fallback: OpenBabel Fallback
            转换行为: Transform Behaviors
            API 契约: API Contracts
            进阶: Advanced
            精确转换行为: Exact Transform Behavior
            Source evidence 与序列化: Source Evidence and Serialization
            CLI 内部契约: Internal CLI Contract
            开发者: Developer
            开发者概览: Developer Overview
            Reader/Writer 插件开发: Reader/Writer Plugin Development
            完整 Parser 契约: Complete Parser Contract
            文档贡献: Documentation Contributions
            开发环境与质量门禁: Development Environment and Quality Gates
            设计与模型: Design and Models
            贡献指南: Contributing
            更新日志: Changelog
hooks:
  - scripts/mkdocs_hooks.py

nav:
  - 首页: index.md
  - 文档版本: versioning.md
  - 快速开始:
    - 安装: getting_started/installation.md
    - 5 分钟上手: getting_started/quickstart.md
    - Python API 初体验: getting_started/python-api.md
    - CLI 初体验: getting_started/cli.md
    - 理解 Batch、File 与 Frame: concepts.md
  - 使用指南:
    - 解析文件: guides/parsing.md
    - 读取计算结果: guides/results.md
    - 批量汇总: guides/batch.md
    - 过滤与选择: guides/filtering.md
    - 格式转换与导出: guides/conversion.md
    - 结构恢复: guides/structure-recovery.md
    - CLI 常用任务: guides/cli-recipes.md
    - 常见问题: guides/troubleshooting.md
  - 任务教程:
